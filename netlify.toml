# Netlify build + deploy settings for KESHPHOTOGRAPHY (Astro static site)
[build]
  command = "npm run build"
  publish = "dist"

# Pretty, secure headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
